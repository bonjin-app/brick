name: 릴리스

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "버전 (예: 0.1.0)"
        required: true

permissions:
  contents: write
  packages: write

jobs:
  release:
    name: 배포본 생성 및 첨부
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # 버전을 지정하지 않는다 — package.json 의 packageManager 가 유일한 출처다.
      # 양쪽에 적으면 action-setup@v4 가 "Multiple versions of pnpm specified" 로 거부한다.
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: 버전 결정
        id: v
        run: |
          if [ -n "${{ inputs.version }}" ]; then
            echo "version=${{ inputs.version }}" >> "$GITHUB_OUTPUT"
          else
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          fi

      - name: 배포본 생성
        run: bash scripts/build-release.sh "${{ steps.v.outputs.version }}"

      - name: 체크섬
        working-directory: dist-release
        run: sha256sum *.tar.gz > SHA256SUMS.txt

      - name: 릴리스에 첨부
        uses: softprops/action-gh-release@v3
        with:
          files: |
            dist-release/*.tar.gz
            dist-release/SHA256SUMS.txt
          body: |
            ## 설치

            **Docker (권장)**
            ```bash
            curl -O https://raw.githubusercontent.com/bonjin-app/brick/main/docker-compose.yml
            echo "BRICK_SECRET=$(openssl rand -base64 32)" > .env
            docker compose up -d
            ```

            **FTP 업로드** — 빌드 불필요
            1. `brick-${{ steps.v.outputs.version }}.tar.gz` 를 내려받아 압축을 풉니다
            2. 서버에 업로드하고 `data`, `uploads` 에 쓰기 권한을 줍니다
            3. `node server.js` 실행 (cPanel/Plesk는 Node.js 앱의 시작 파일로 지정)
            4. 브라우저로 접속해 데이터베이스 정보를 입력합니다

            요구사항: Node.js 20.11+, PostgreSQL 14+
            자세한 내용은 [설치 가이드](https://github.com/bonjin-app/brick/blob/main/docs/installation.md)를 참고하세요.

  # docker-compose.yml 이 가리키는 ghcr.io/bonjin-app/brick:latest 는 여기서 만들어진다.
  # (CI 의 docker 잡은 빌드만 검증하고 push 하지 않는다 — 태그가 붙은 릴리스만 이미지가 된다)
  image:
    name: Docker 이미지 발행 (GHCR)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: 버전 결정
        id: v
        run: |
          if [ -n "${{ inputs.version }}" ]; then
            echo "version=${{ inputs.version }}" >> "$GITHUB_OUTPUT"
          else
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          fi
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: 빌드 · 푸시
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          push: true
          build-args: |
            BRICK_VERSION=${{ steps.v.outputs.version }}
          tags: |
            ghcr.io/bonjin-app/brick:${{ steps.v.outputs.version }}
            ghcr.io/bonjin-app/brick:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
