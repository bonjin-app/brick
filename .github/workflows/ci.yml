name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: 빌드 및 스모크 테스트
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: brick
          POSTGRES_PASSWORD: brick
          POSTGRES_DB: brick
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U brick"
          --health-interval 5s --health-timeout 5s --health-retries 10

    env:
      DATABASE_URL: postgresql://brick:brick@localhost:5432/brick
      BRICK_SECRET: ci-secret-not-for-production-use
      BRICK_API_PORT: "3001"

    steps:
      - uses: actions/checkout@v7

      # 버전을 지정하지 않는다 — package.json 의 packageManager 가 유일한 출처다.
      # 양쪽에 적으면 action-setup@v4 가 "Multiple versions of pnpm specified" 로 거부한다.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: 빌드 (타입검사 포함)
        run: pnpm build
      - name: 테마 CSS 컴파일 산출물 일치 (소스만 고치고 컴파일을 잊지 않았는가)
        run: |
          bash scripts/build-themes.sh
          git diff --exit-code -- themes/*/assets/style.css \
            || { echo "::error::themes/*/src 를 고쳤으면 pnpm build:themes 결과(assets/style.css)도 커밋해야 합니다"; exit 1; }

      - name: 마이그레이션
        run: node apps/api/dist/migrate.js
        env:
          BRICK_MIGRATIONS_DIR: packages/database/migrations

      - name: 마이그레이션 멱등성 확인 (2회 실행)
        run: node apps/api/dist/migrate.js
        env:
          BRICK_MIGRATIONS_DIR: packages/database/migrations

      - name: E2E 스모크 테스트 (코어)
        run: bash scripts/smoke-test.sh

      - name: E2E 스모크 테스트 (회원 생애주기)
        run: bash scripts/smoke-member.sh

      - name: E2E 스모크 테스트 (그누보드 이전)
        run: bash scripts/smoke-migrate.sh

      - name: E2E 스모크 테스트 (문의·FAQ·사이트맵)
        run: bash scripts/smoke-helpdesk.sh

      - name: E2E 스모크 테스트 (설문조사)
        run: bash scripts/smoke-poll.sh

      - name: E2E 스모크 테스트 (회원 단체메일)
        run: bash scripts/smoke-mailing.sh

      - name: E2E 스모크 테스트 (게시판)
        run: bash scripts/smoke-board.sh

      - name: E2E 스모크 테스트 (포인트)
        run: bash scripts/smoke-point.sh

      - name: E2E 스모크 테스트 (쪽지·스크랩)
        run: bash scripts/smoke-memo.sh

      - name: E2E 스모크 테스트 (커머스)
        run: bash scripts/smoke-shop.sh

      - name: E2E 스모크 테스트 (취소·반품·교환)
        run: bash scripts/smoke-returns.sh

      - name: E2E 스모크 테스트 (사업자정보·위시리스트·지역배송비)
        run: bash scripts/smoke-storefront.sh

      - name: E2E 스모크 테스트 (판매 리포트·관련 상품)
        run: bash scripts/smoke-reports.sh

      - name: E2E 스모크 테스트 (세금 증빙)
        run: bash scripts/smoke-tax.sh

      - name: E2E 스모크 테스트 (계정 보안 · 2단계 인증)
        run: bash scripts/smoke-account-security.sh

      - name: E2E 스모크 테스트 (결제 게이트웨이 · 개인결제)
        run: bash scripts/smoke-payments.sh

      - name: E2E 스모크 테스트 (통합검색 · 검색 로그)
        run: bash scripts/smoke-search.sh

      - name: E2E 스모크 테스트 (재입고 알림)
        run: bash scripts/smoke-restock.sh

      - name: E2E 스모크 테스트 (사이트 스타터)
        run: bash scripts/smoke-starter.sh

      - name: E2E 스모크 테스트 (테마 · 랜딩 · 화면 제목)
        run: bash scripts/smoke-theme.sh

      - name: E2E 스모크 테스트 (모더레이션 · 금지 단어 · 차단 IP)
        run: bash scripts/smoke-moderation.sh

      - name: E2E 스모크 테스트 (원클릭 업데이트 · 서명 검증)
        run: bash scripts/smoke-updates.sh

      - name: E2E 스모크 테스트 (회원 등급)
        run: bash scripts/smoke-grades.sh

      - name: E2E 스모크 테스트 (쿠폰 고도화)
        run: bash scripts/smoke-coupons.sh

      - name: E2E 스모크 테스트 (기획전)
        run: bash scripts/smoke-collections.sh

      - name: E2E 스모크 테스트 (정기결제)
        run: bash scripts/smoke-subscriptions.sh

      - name: E2E 스모크 테스트 (플러그인 개발 템플릿)
        run: bash scripts/smoke-create-plugin.sh

      - name: E2E 스모크 테스트 (OpenAPI 문서)
        run: bash scripts/smoke-openapi.sh

      - name: E2E 스모크 테스트 (플러그인 레지스트리)
        run: bash scripts/smoke-registry.sh

      - name: E2E 스모크 테스트 (다국어)
        run: bash scripts/smoke-i18n.sh

      - name: E2E 스모크 테스트 (방문자·팝업)
        run: bash scripts/smoke-site.sh

      - name: E2E 스모크 테스트 (소셜 로그인)
        run: bash scripts/smoke-social.sh

      - name: E2E 스모크 테스트 (보안·결제)
        run: bash scripts/smoke-security.sh

      - name: pnpm deploy 번들 검증 (Docker 런타임과 동일 경로)
        run: |
          pnpm deploy --filter=@brick/api --prod /tmp/deploy-api
          test -f /tmp/deploy-api/dist/main.js

  release:
    name: 배포본(FTP 설치) 검증
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: brick
          POSTGRES_PASSWORD: brick
          POSTGRES_DB: brick
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U brick"
          --health-interval 5s --health-timeout 5s --health-retries 10

    steps:
      - uses: actions/checkout@v7
      # 버전을 지정하지 않는다 — package.json 의 packageManager 가 유일한 출처다.
      # 양쪽에 적으면 action-setup@v4 가 "Multiple versions of pnpm specified" 로 거부한다.
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: 배포본 생성 + FTP 설치 경로 E2E
        run: bash scripts/smoke-release.sh
        env:
          # 설치 마법사에 "입력할" DB. 앱에는 전달되지 않는다(스크립트가 env -u로 차단)
          DATABASE_URL: postgresql://brick:brick@localhost:5432/brick

      - name: 배포본 업로드 (아티팩트)
        uses: actions/upload-artifact@v4
        with:
          name: brick-release
          path: dist-release/*.tar.gz
          retention-days: 14

  docker:
    name: Docker 이미지 빌드 · 실행
    runs-on: ubuntu-latest
    # 빌드만 하면 "이미지는 만들어졌는데 컨테이너가 안 뜨는" 회귀를 못 본다(네이티브 의존성·빠진 파일·
    # 마이그레이션 경로). 실제 PostgreSQL 과 함께 띄워 설치 마법사까지 통과시킨다 — 사용자의 첫 5분.
    services:
      db:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: brick
          POSTGRES_PASSWORD: brick
          POSTGRES_DB: brick
        options: >-
          --health-cmd "pg_isready -U brick -d brick"
          --health-interval 5s --health-timeout 3s --health-retries 10
        ports: ["5432:5432"]
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v3
      - name: 이미지 빌드
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          push: false
          load: true
          tags: brick:ci
          build-args: |
            BRICK_VERSION=0.0.0-ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: 컨테이너 실행 → 설치 마법사 → 첫 화면
        run: |
          set -euo pipefail
          docker run -d --name brick --network host \
            -e DATABASE_URL=postgresql://brick:brick@127.0.0.1:5432/brick \
            -e BRICK_SECRET=ci-secret-value-that-is-long-enough-0123456789 \
            -e BRICK_CAPTCHA=off brick:ci
          for i in $(seq 1 60); do
            curl -fsS http://127.0.0.1:3000/readyz >/dev/null 2>&1 && break
            sleep 2
          done
          curl -fsS http://127.0.0.1:3000/readyz
          echo; echo "── 설치"
          curl -fsS -X POST http://127.0.0.1:3000/api/install -H 'content-type: application/json' \
            -d '{"siteName":"CI","adminEmail":"admin@ci.test","adminPassword":"cipass12345","starter":"community"}' >/dev/null
          echo "── 홈 200 · 테마 CSS · 관리자 버전"
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:3000/)" = "200"
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:3000/themes/default/assets/style.css)" = "200"
          curl -s -c ck.txt -X POST http://127.0.0.1:3000/api/auth/login -H 'content-type: application/json' \
            -d '{"email":"admin@ci.test","password":"cipass12345"}' >/dev/null
          curl -fsS -b ck.txt http://127.0.0.1:3000/api/admin/version | tee version.json
          grep -q '"version":"0.0.0-ci"' version.json
          echo; echo "✅ 컨테이너가 설치·렌더·버전 보고까지 동작"
      - name: 컨테이너 로그 (실패 시 진단용)
        if: always()
        run: docker logs brick 2>&1 | tail -80
