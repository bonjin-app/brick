<!--
  GitHub 소셜 미리보기 이미지 (1280×640).

  저장소 링크를 슬랙·트위터·검색 결과에 붙일 때 뜨는 카드 이미지다.
  GitHub는 PNG/JPG만 받으므로 이 SVG를 PNG로 변환해 업로드한다:
    bash scripts/make-social-preview.sh
-->
<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640"
     font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#12141c" />
      <stop offset="55%" stop-color="#1a1f2e" />
      <stop offset="100%" stop-color="#241a2e" />
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ff6b4a" />
      <stop offset="100%" stop-color="#ffa24a" />
    </linearGradient>
    <linearGradient id="brickFace" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff7a55" />
      <stop offset="100%" stop-color="#e2502c" />
    </linearGradient>
  </defs>

  <rect width="1280" height="640" fill="url(#bg)" />

  <!-- 배경: 쌓인 벽돌 — 플러그인이 쌓여 사이트가 되는 구조를 암시 -->
  <g opacity="0.07" transform="translate(-44, 26)">
    <g fill="#ffffff">
      <rect x="880" y="150" width="150" height="62" rx="8" />
      <rect x="1046" y="150" width="150" height="62" rx="8" />
      <rect x="797" y="228" width="150" height="62" rx="8" />
      <rect x="963" y="228" width="150" height="62" rx="8" />
      <rect x="1129" y="228" width="150" height="62" rx="8" />
      <rect x="880" y="306" width="150" height="62" rx="8" />
      <rect x="1046" y="306" width="150" height="62" rx="8" />
      <rect x="963" y="384" width="150" height="62" rx="8" />
      <rect x="1129" y="384" width="150" height="62" rx="8" />
    </g>
  </g>

  <!-- 로고 -->
  <g transform="translate(96, 92)">
    <rect x="0" y="0" width="76" height="34" rx="7" fill="url(#brickFace)" />
    <rect x="0" y="42" width="34" height="34" rx="7" fill="url(#brickFace)" opacity="0.78" />
    <rect x="42" y="42" width="34" height="34" rx="7" fill="url(#brickFace)" opacity="0.55" />
  </g>

  <text x="192" y="146" fill="#ffffff" font-size="58" font-weight="800" letter-spacing="-1">Brick</text>

  <!-- 주제문 -->
  <text x="96" y="272" fill="#ffffff" font-size="62" font-weight="800" letter-spacing="-1.5">
    설치는 그누보드처럼 쉽게,
  </text>
  <text x="96" y="348" font-size="62" font-weight="800" letter-spacing="-1.5" fill="url(#accent)">
    속은 현대적으로.
  </text>

  <text x="96" y="416" fill="#9aa3b8" font-size="27" font-weight="500">
    Docker 한 줄, 또는 FTP 업로드로 설치하는 오픈소스 CMS
  </text>

  <!-- 스택 -->
  <g transform="translate(96, 470)">
    <g fill="#c7cede" font-size="23" font-weight="600">
      <rect x="0" y="0" width="130" height="46" rx="23" fill="#ffffff" opacity="0.08" />
      <text x="65" y="30" text-anchor="middle">Next.js</text>

      <rect x="144" y="0" width="130" height="46" rx="23" fill="#ffffff" opacity="0.08" />
      <text x="209" y="30" text-anchor="middle">NestJS</text>

      <rect x="288" y="0" width="184" height="46" rx="23" fill="#ffffff" opacity="0.08" />
      <text x="380" y="30" text-anchor="middle">PostgreSQL</text>

      <rect x="486" y="0" width="160" height="46" rx="23" fill="#ffffff" opacity="0.08" />
      <text x="566" y="30" text-anchor="middle">TypeScript</text>
    </g>
  </g>

  <!-- 특징 -->
  <text x="96" y="580" fill="#6f7891" font-size="22" font-weight="500">
    게시판 · 쇼핑몰 · 포인트 · 쪽지 · 소셜 로그인 · 플러그인 ZIP 설치
  </text>

  <rect x="0" y="632" width="1280" height="8" fill="url(#accent)" />
</svg>
