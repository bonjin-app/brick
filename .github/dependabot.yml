# 의존성 업데이트.
#
# 매주 한 번, 패치·마이너는 묶어서 올린다 — PR이 스무 개씩 열리면
# 아무도 보지 않게 되고, 그게 업데이트를 안 하는 것보다 나쁘다.
# 메이저는 따로 올려 사람이 판단하게 한다.
version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule: { interval: weekly, day: monday }
    open-pull-requests-limit: 5
    labels: ["dependencies"]
    commit-message:
      prefix: "deps"
    groups:
      patch-and-minor:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    ignore:
      # 메이저는 그룹에서 빼고 개별 PR로 받는다
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: "/"
    schedule: { interval: monthly }
    labels: ["dependencies"]
    commit-message:
      prefix: "ci"
    groups:
      # 아티팩트를 올리는 쪽과 내려받는 쪽은 한 짝이다(릴리스 워크플로가 도커 이미지의 digest 를 넘긴다). 따로 올리면 한쪽만
      # 새 버전이 되고, 그 경로는 태그를 달 때만 돌아 CI 가 시험하지 못한다 — 한 PR 로 같이 받는다
      artifact-pair:
        patterns: ["actions/upload-artifact", "actions/download-artifact"]

  - package-ecosystem: docker
    directory: "/docker"
    schedule: { interval: monthly }
    labels: ["dependencies"]
