# Brick 설치 = 이 파일 + `docker compose up -d`
# 접속: http://localhost:3000 → 설치 마법사
#
# 업데이트 = `docker compose pull && docker compose up -d`
#   (DB 마이그레이션은 컨테이너가 부팅할 때 스스로 적용한다)
#
# Redis/MinIO는 의도적으로 없다 — Brick Core는 PostgreSQL만으로 동작한다 (ADR-3).
services:
  brick:
    # 특정 버전에 고정하려면 .env 에 BRICK_IMAGE_TAG=0.2.0
    image: ghcr.io/bonjin-app/brick:${BRICK_IMAGE_TAG:-latest}
    # 소스에서 직접 빌드하려면 위 image를 지우고 아래 주석을 해제:
    # build:
    #   context: .
    #   dockerfile: docker/Dockerfile
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgresql://brick:${POSTGRES_PASSWORD:-brick}@db:5432/brick
      # 필수: openssl rand -base64 32 으로 생성해 .env에 넣으세요
      BRICK_SECRET: ${BRICK_SECRET:?BRICK_SECRET is required — generate with "openssl rand -base64 32"}
      NODE_ENV: production
      # 리버스 프록시(Nginx/Traefik/Cloudflare) 뒤에 두면 true
      BRICK_TRUST_PROXY: ${BRICK_TRUST_PROXY:-false}
      BRICK_MAX_UPLOAD_MB: ${BRICK_MAX_UPLOAD_MB:-50}
      # 메일 링크에 쓰는 공개 주소 — 실제 도메인으로 바꾸세요
      BRICK_SITE_URL: ${BRICK_SITE_URL:-http://localhost:3000}
      # 메일 (선택). 미설정 시 비밀번호 재설정 링크가 로그에만 출력됩니다
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: ${SMTP_FROM:-}
    volumes:
      # ZIP 업로드로 설치되는 확장과 업로드 파일은 볼륨에 남아
      # 컨테이너 이미지 업데이트에도 유지된다
      - brick_plugins:/app/plugins
      - brick_themes:/app/themes
      - brick_uploads:/app/uploads
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      # readyz 는 DB 연결까지 본다 — 마이그레이션이 끝나 트래픽을 받을 수 있을 때 healthy
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/readyz >/dev/null 2>&1 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 60s
    restart: unless-stopped

  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: brick
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-brick}
      POSTGRES_DB: brick
      # 한국어 검색/정렬을 위해 UTF-8 로케일로 초기화
      LANG: ko_KR.utf8
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C.UTF-8"
    volumes:
      - brick_db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U brick -d brick"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

volumes:
  brick_db:
  brick_plugins:
  brick_themes:
  brick_uploads:
